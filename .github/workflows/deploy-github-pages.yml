name: Deploy client previews (GitHub Pages)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare static sites for GitHub Pages
        run: |
          rm -rf pages-deploy
          mkdir -p pages-deploy/art-form
          PAGES_OUT="$GITHUB_WORKSPACE/pages-deploy" \
            PAGES_BASE="/High-Prospective-Clients/" \
            node ClearwaterDentist/rebuild/scripts/prepare-pages.mjs
          PAGES_OUT="$GITHUB_WORKSPACE/pages-deploy/art-form" \
            PAGES_BASE="/High-Prospective-Clients/art-form/" \
            node Art-Form-Plastic-Surgery/rebuild/scripts/prepare-pages.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages-deploy

      - id: deployment
        uses: actions/deploy-pages@v4
